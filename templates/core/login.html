{% extends "base.html" %}

{% block title %}Giriş Yap - {{ block.super }}{% endblock %}

{% block extra_head %}
<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .login-card {
        background: rgba(30, 30, 30, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 2.5rem;
        width: 100%;
        max-width: 400px;
    }
    .form-control {
        background-color: rgba(0, 0, 0, 0.2);
        border: 1px solid #444;
        color: var(--bs-body-color);
    }
    .form-control:focus {
        background-color: rgba(0, 0, 0, 0.3);
        border-color: #888;
        color: var(--bs-body-color);
        box-shadow: none;
    }
    .btn-primary {
        background-color: #0d6efd;
        border: none;
        transition: background-color 0.2s ease-in-out;
    }
    .btn-primary:hover {
        background-color: #0b5ed7;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h2 class="text-center mb-4">Giriş Yap</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" id="id_username" required>
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger" role="alert">
                    Kullanıcı adı veya şifre hatalı.
                </div>
            {% endif %}
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Giriş Yap</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
